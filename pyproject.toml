[project]
name = "learn-dynamical-system"
version = "0.1.0"
description = "力学系を学ぶための教材プロジェクト"
authors = [
    { name = "kdingn", email = "koukou3335@gmail.com" }
]
dependencies = [
    "matplotlib",
    "scienceplots",
    "numpy",
    "scipy",
]
readme = "README.md"
requires-python = ">= 3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.rye.scripts]
# `rye run figures` で public/ 配下の生成物を一括で作る（図 → 動画の順）。
# 個別に回したいときは下の 2 つを直接呼ぶ。
figures = { chain = ["figures:images", "figures:animations"] }
"figures:images" = "python -m learn_dynamical_system.figures"
"figures:animations" = "python -m learn_dynamical_system.animations"
check-slides = "python scripts/check_slides.py"
check-terms = "python scripts/check_terms.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/learn_dynamical_system"]
